<!-- Main content of the page -->
<div class="container">
    <h1>نحن هنا لمساعدتكم</h1>
    <h2>يسعدنا سماع استفساراتكم وملاحظاتكم.</h2>

    <form name="contactForm" id="contactForm">
        <label for="fname">الاسم الكامل:</label>
        <input type="text" id="fname" name="fname" maxlength="15" size="20" placeholder="مثال: نورة السالمي">
        <span id="fname-error" class="error-message"></span>
        <br/>
        
        <label for="email">البريد الإلكتروني:</label>
        <input type="email" id="email" placeholder="name@domain.com">    
        <span id="email-error" class="error-message"></span>
        <br/>

        <label for="phone">رقم الهاتف:</label>
        <input type="tel" id="phone" placeholder="05XXXXXXXX :مثال">    
        <span id="phone-error" class="error-message"></span>
        <br/>
        
        <label for="message">الرسالة:</label> 
        <textarea id="message" name="message" rows="7" placeholder="اكتب رسالتك هنا."></textarea> 
        <span id="message-error" class="error-message"></span>            
        <br/>
                
        <!-- Captcha -->
        <label>التحقق: <span id="captchaQuestion"></span></label>
        <input type="text" id="captchaAnswer" placeholder="Enter the captcha answer">
        <span id="error" class="error-message"></span>

        <!-- submit -->
        <input type="submit" value="إرسال" name="Submit" />
        <input type="reset" value="Reset">
    </form>
</div>

<script src="script.js" defer></script>
