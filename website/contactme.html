    <!-- Header Section -->

        <img src="logo.png" width="200" height="200" alt="Personal Logo" class="logo" />

    <!-- Contact Form Section -->
    <section class="contact-form">
        <h2>Contact Me</h2>
        <form onsubmit="return validateForm()">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name.." required>
            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email.." required>
            
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Write your message.." rows="5" required></textarea>
            
            <label for="captcha">What is 3 + 5?</label>
            <input type="text" id="captcha" placeholder="Your answer..." required>
            
            <button type="submit">Send Message</button>
        </form>
    </section>

    <!-- New Email Section -->
    <section class="email-section">
        <h2>Contact Me by Email</h2>
        <p>You can reach me at: <a href="mailto:danaa.nunu@gmail.com">danaa.nunu@gmail.com</a></p>
        <p>Feel free to contact me anytime!</p>
    </section>
